rules:
  people:
    native_key:
      op: unique
      field: person
      message: Repeated native identifier
    missing_key:
      op: required
      field: person
      message: Missing native identifier
    duplicate_payload:
      op: duplicate
      field: person
      message: Repeated source payload
      classification: potential_anomaly
      severity: warning
  patient:
    identity:
      op: required
      field: patient_id
      message: Canonical identity unavailable
  visits:
    native_key:
      op: unique
      field: visit
      message: Repeated native identifier
    missing_key:
      op: required
      field: visit
      message: Missing native identifier
    duplicate_payload:
      op: duplicate
      field: visit
      message: Repeated source payload
      classification: potential_anomaly
      severity: warning
    patient_reference:
      op: reference
      field: person
      message: Reference must resolve to exactly one registered record
      reference: people
      other: person
    event_time:
      op: timestamp
      field: opened
      message: Invalid start time
    event_order:
      op: ordered
      field: opened
      message: End precedes start
      other: closed
  encounter:
    identity:
      op: required
      field: encounter_id
      message: Canonical identity unavailable
  labs:
    duplicate_payload:
      op: duplicate
      field: person
      message: Repeated source payload
      classification: potential_anomaly
      severity: warning
    patient_reference:
      op: reference
      field: person
      message: Reference must resolve to exactly one registered record
      reference: people
      other: person
    encounter_reference:
      op: reference
      field: visit
      message: Encounter must resolve uniquely and belong to the same patient
      reference: visits
      other: visit
      version: "2"
      match_fields: {person: person}
    numeric_parse:
      op: numeric
      field: reading
      message: Expected finite numeric measurement
      where:
        kind: N
    a1_unit:
      op: units
      field: unit
      message: Unit outside configured concept contract
      where:
        analyte: A1
      allowed:
      - pct
    systolic_unit:
      op: units
      field: unit
      message: Unit outside configured concept contract
      where:
        analyte: SYS
      allowed:
      - mm[Hg]
    diastolic_unit:
      op: units
      field: unit
      message: Unit outside configured concept contract
      where:
        analyte: DIA
      allowed:
      - mm[Hg]
  observation:
    identity:
      op: required
      field: event_id
      message: Canonical identity unavailable
    observed_time:
      op: required
      field: observed
      message: Valid observation time required
criteria:
  hba1c:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 1
    date_field: observed
    filter:
      concept:
      - hba1c
      unit:
      - pct
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  hba1c_trend:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      concept:
      - hba1c
      unit:
      - pct
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  systolic:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      unit:
      - mm[Hg]
      concept:
      - systolic
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  diastolic:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      unit:
      - mm[Hg]
      concept:
      - diastolic
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  bp_pairs:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: paired_dates
    threshold: 2
    pair_field: concept
    pair_values:
    - systolic
    - diastolic
    pair_keys:
    - encounter_id
    date_field: observed
    filter:
      unit:
      - mm[Hg]
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  encounters:
    entity: encounter
    patient_field: patient_id
    strategy: count
    threshold: 2
    distinct_field: encounter_id
    exclude_rules:
    - event_order
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  history:
    entity: encounter
    patient_field: patient_id
    strategy: span_days
    threshold: 365
    date_field: start
    exclude_rules:
    - event_order
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  medications:
    entity: medication
    patient_field: patient_id
    strategy: count
    threshold: 1
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  diabetes:
    uncertain_fields: [system, code]
    entity: condition
    patient_field: patient_id
    strategy: count
    threshold: 1
    filter:
      system:
      - SNOMED-CT
      code:
      - '44054006'
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  hypertension:
    uncertain_fields: [system, code]
    entity: condition
    patient_field: patient_id
    strategy: count
    threshold: 1
    filter:
      system:
      - SNOMED-CT
      code:
      - '59621000'
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
tasks:
  hba1c:
  - hba1c
  hba1c_trend:
  - hba1c_trend
  systolic:
  - systolic
  diastolic:
  - diastolic
  bp_pairs:
  - bp_pairs
  encounters:
  - encounters
  history:
  - history
  medications:
  - medications
  diabetes:
  - diabetes
  hypertension:
  - hypertension
  diabetes_followup:
  - diabetes
  - hba1c_trend
  hypertension_followup:
  - hypertension
  - bp_pairs
concepts:
  observation:
    scope: dataset-local
    version: '1'
    rationale: Explicit source code, value type and unit agreement within this delivery.
      Cross-dataset equivalence is unreviewed.
