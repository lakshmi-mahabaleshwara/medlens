criteria:
  hba1c:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 1
    date_field: observed
    filter:
      concept:
      - hba1c
      unit:
      - '%'
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  hba1c_trend:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      concept:
      - hba1c
      unit:
      - '%'
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  systolic:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      unit:
      - mm[Hg]
      concept:
      - systolic
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  diastolic:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: distinct_dates
    threshold: 2
    date_field: observed
    filter:
      unit:
      - mm[Hg]
      concept:
      - diastolic
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  bp_pairs:
    uncertain_fields: [concept]
    entity: observation
    patient_field: patient_id
    strategy: paired_dates
    threshold: 2
    pair_field: concept
    pair_values:
    - systolic
    - diastolic
    pair_keys:
    - encounter_id
    date_field: observed
    filter:
      unit:
      - mm[Hg]
    numeric_field: numeric_value
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  encounters:
    entity: encounter
    patient_field: patient_id
    strategy: count
    threshold: 2
    distinct_field: encounter_id
    exclude_rules:
    - event_order
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  history:
    entity: encounter
    patient_field: patient_id
    strategy: span_days
    threshold: 365
    date_field: start
    exclude_rules:
    - event_order
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  medications:
    entity: medication
    patient_field: patient_id
    strategy: count
    threshold: 1
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  diabetes:
    uncertain_fields: [system, code]
    entity: condition
    patient_field: patient_id
    strategy: count
    threshold: 1
    filter:
      system:
      - SNOMED-CT
      code:
      - '44054006'
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
  hypertension:
    uncertain_fields: [system, code]
    entity: condition
    patient_field: patient_id
    strategy: count
    threshold: 1
    filter:
      system:
      - SNOMED-CT
      code:
      - '59621000'
    exclude_rules:
    - patient_reference
    - encounter_reference
    - missing_key
    - native_key
